<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Respuesta JSON de /api/metrics</title>
    <style>
        :root {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f1f5f9;
        }

        * { box-sizing: border-box; }

        body { margin: 0; }

        header {
            padding: 24px max(20px, calc((100% - 980px) / 2));
            color: #fff;
            background: #0f172a;
        }

        header h1 { margin: 0 0 8px; font-size: 1.4rem; }
        header p { margin: 0; color: #cbd5e1; }
        main { width: min(980px, calc(100% - 32px)); margin: 24px auto; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .toolbar a { color: #0369a1; font-weight: 650; }

        button {
            border: 0;
            border-radius: 7px;
            padding: 9px 13px;
            color: #fff;
            background: #0369a1;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        button:disabled { opacity: .65; cursor: wait; }
        #status { color: #475569; font-size: .9rem; }

        pre {
            min-height: 260px;
            overflow: auto;
            margin: 0;
            padding: 20px;
            border: 1px solid #263449;
            border-radius: 10px;
            color: #dbeafe;
            background: #111827;
            font: 14px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <header>
        <h1>Respuesta de la API de métricas</h1>
        <p>Contenido obtenido en vivo desde <code>/api/metrics</code>.</p>
    </header>
    <main>
        <div class="toolbar">
            <a href="/evidencias/">Volver a evidencias</a>
            <span id="status" role="status" aria-live="polite">Consultando API...</span>
            <button id="refresh" type="button">Actualizar respuesta</button>
        </div>
        <pre id="response" aria-label="Respuesta JSON de /api/metrics"></pre>
    </main>
    <script>
        const status = document.getElementById('status');
        const response = document.getElementById('response');
        const refresh = document.getElementById('refresh');

        async function loadMetrics() {
            refresh.disabled = true;
            status.textContent = 'Consultando /api/metrics...';

            try {
                const result = await fetch('/api/metrics', {
                    headers: { Accept: 'application/json' },
                    cache: 'no-store',
                });

                if (!result.ok) {
                    throw new Error(`La API respondió HTTP ${result.status}`);
                }

                response.textContent = JSON.stringify(await result.json(), null, 2);
                status.textContent = `HTTP ${result.status} · Actualizado: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                response.textContent = 'No se pudo obtener la respuesta de /api/metrics.';
                status.textContent = error.message;
                console.error('Error al consultar /api/metrics:', error);
            } finally {
                refresh.disabled = false;
            }
        }

        refresh.addEventListener('click', loadMetrics);
        loadMetrics();
    </script>
</body>
</html>
